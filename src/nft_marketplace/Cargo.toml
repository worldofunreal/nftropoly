[package]
name = "nft_marketplace"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.12"
ic-cdk-macros = "0.8"
ic-stable-structures = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ICRC standards support
icrc-ledger-types = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Optional: For advanced features
rand = "0.8"
hex = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "marketplace_benchmarks"
harness = false
