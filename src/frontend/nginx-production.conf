server {
    server_name nftropoly.com www.nftropoly.com;

    # Serve static files directly (better performance)
    location /_nuxt/ {
        alias /var/www/nftropoly.com/public/_nuxt/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_ipx/ {
        alias /var/www/nftropoly.com/public/_ipx/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy to Node.js server (for SSR)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Add some timeouts for better stability
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nftropoly.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nftropoly.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.nftropoly.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = nftropoly.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name nftropoly.com www.nftropoly.com;
    return 404; # managed by Certbot
} 